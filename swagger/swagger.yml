swagger: "2.0"
info:
  title: Rental Property API
  description: |
    REST API for rental property search and lookup
  version: 1.0.0
basePath: /v1
paths:
  /v1/properties:
    get:
      tags:
      - w3-a4/controllersPropertyController
      description: |-
        Get rental properties with optional filters
        <br>
      operationId: PropertyController.List Properties
      parameters:
      - in: query
        name: min_price
        description: Minimum price
        type: number
      - in: query
        name: max_price
        description: Maximum price
        type: number
      - in: query
        name: min_review_score
        description: Minimum review score
        type: number
      - in: query
        name: feed
        description: Property feed (11,12,22,24)
        type: integer
        format: int64
      - in: query
        name: published
        description: Published status
        type: boolean
      - in: query
        name: property_type
        description: Property type
        type: string
      - in: query
        name: min_star_rating
        description: Minimum star rating
        type: integer
        format: int64
      - in: query
        name: min_reviews
        description: Minimum number of reviews
        type: integer
        format: int64
      - in: query
        name: min_bedroom
        description: Minimum bedrooms
        type: integer
        format: int64
      - in: query
        name: amenities
        description: Comma separated amenities
        type: string
      - in: query
        name: limit
        description: Maximum number of results
        type: integer
        format: int64
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/models.PropertyListResponse'
        "400":
          description: '{object} models.ErrorResponse'
        "500":
          description: '{object} models.ErrorResponse'
  /v1/properties/{id}:
    get:
      tags:
      - w3-a4/controllersPropertyController
      description: |-
        Get a single rental property by ID
        <br>
      operationId: PropertyController.Get Property By ID
      parameters:
      - in: path
        name: id
        description: Property ID
        required: true
        type: string
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/models.PropertyResponse'
        "404":
          description: '{object} models.ErrorResponse'
        "500":
          description: '{object} models.ErrorResponse'
definitions:
  models.GeoInfo:
    title: GeoInfo
    type: object
    properties:
      Breadcrumbs:
        type: array
        items:
          type: string
      City:
        type: string
      Country:
        type: string
      CountryCode:
        type: string
      Lat:
        type: number
        format: double
      LocationID:
        type: string
      Lon:
        type: number
        format: double
      Name:
        type: string
      State:
        type: string
      StateAbbr:
        type: string
  models.ImageInfo:
    title: ImageInfo
    type: object
    properties:
      Count:
        type: integer
        format: int64
      Images:
        type: array
        items:
          type: string
  models.PropertyCounts:
    title: PropertyCounts
    type: object
    properties:
      Bathroom:
        type: integer
        format: int64
      Bedroom:
        type: integer
        format: int64
      Occupancy:
        type: integer
        format: int64
      Reviews:
        type: number
        format: double
  models.PropertyInfo:
    title: PropertyInfo
    type: object
    properties:
      Amenities:
        type: array
        items:
          type: string
      Counts:
        $ref: '#/definitions/models.PropertyCounts'
      Image:
        $ref: '#/definitions/models.ImageInfo'
      Name:
        type: string
      Price:
        type: number
        format: double
      PropertyType:
        type: string
      ReviewScore:
        type: number
        format: double
      Slug:
        type: string
      StarRating:
        type: integer
        format: int64
  models.PropertyListResponse:
    title: PropertyListResponse
    type: object
    properties:
      Result:
        $ref: '#/definitions/models.Result'
  models.PropertyResponse:
    title: PropertyResponse
    type: object
    properties:
      Feed:
        type: integer
        format: int64
      GeoInfo:
        $ref: '#/definitions/models.GeoInfo'
      ID:
        type: string
      Property:
        $ref: '#/definitions/models.PropertyInfo'
      Published:
        type: boolean
  models.Result:
    title: Result
    type: object
    properties:
      Count:
        type: integer
        format: int64
      Items:
        type: array
        items:
          $ref: '#/definitions/models.PropertyResponse'
